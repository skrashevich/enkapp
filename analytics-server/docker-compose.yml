services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - aptabase
      - glitchtip-web
    ports:
      - "80:80"
      - "443:443"
    environment:
      ANALYTICS_DOMAIN: ${ANALYTICS_DOMAIN}
      ERRORS_DOMAIN: ${ERRORS_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  aptabase-db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aptabase
      POSTGRES_PASSWORD: ${APTABASE_POSTGRES_PASSWORD}
      POSTGRES_DB: aptabase
    volumes:
      - aptabase-db-data:/var/lib/postgresql/data

  aptabase-events-db:
    image: clickhouse/clickhouse-server:23.8.4.69-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: aptabase
      CLICKHOUSE_PASSWORD: ${APTABASE_CLICKHOUSE_PASSWORD}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - aptabase-events-data:/var/lib/clickhouse

  aptabase:
    image: ghcr.io/aptabase/aptabase:main
    restart: unless-stopped
    depends_on:
      - aptabase-db
      - aptabase-events-db
    expose:
      - "8080"
    environment:
      BASE_URL: https://${ANALYTICS_DOMAIN}
      AUTH_SECRET: ${APTABASE_AUTH_SECRET}
      DATABASE_URL: Server=aptabase-db;Port=5432;User Id=aptabase;Password=${APTABASE_POSTGRES_PASSWORD};Database=aptabase
      CLICKHOUSE_URL: Host=aptabase-events-db;Port=8123;Username=aptabase;Password=${APTABASE_CLICKHOUSE_PASSWORD}

  glitchtip-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: ${GLITCHTIP_POSTGRES_PASSWORD}
      POSTGRES_DB: glitchtip
    volumes:
      - glitchtip-postgres-data:/var/lib/postgresql/data

  glitchtip-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${GLITCHTIP_REDIS_PASSWORD}
    volumes:
      - glitchtip-redis-data:/data

  glitchtip-web:
    image: glitchtip/glitchtip:latest
    restart: unless-stopped
    depends_on:
      - glitchtip-postgres
      - glitchtip-redis
      - glitchtip-migrate
    expose:
      - "8000"
    environment: &glitchtip-environment
      DATABASE_URL: postgres://glitchtip:${GLITCHTIP_POSTGRES_PASSWORD}@glitchtip-postgres:5432/glitchtip
      REDIS_URL: redis://:${GLITCHTIP_REDIS_PASSWORD}@glitchtip-redis:6379
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      PORT: "8000"
      GLITCHTIP_DOMAIN: https://${ERRORS_DOMAIN}
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL}
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_DEFAULT_FROM_EMAIL}
      ENABLE_OPEN_USER_REGISTRATION: ${GLITCHTIP_ENABLE_OPEN_USER_REGISTRATION}
      CELERY_WORKER_AUTOSCALE: "1,3"
      CELERY_WORKER_MAX_TASKS_PER_CHILD: "10000"
    volumes:
      - glitchtip-uploads:/code/uploads

  glitchtip-worker:
    image: glitchtip/glitchtip:latest
    restart: unless-stopped
    depends_on:
      - glitchtip-postgres
      - glitchtip-redis
      - glitchtip-migrate
    command: ./bin/run-celery-with-beat.sh
    environment: *glitchtip-environment
    volumes:
      - glitchtip-uploads:/code/uploads

  glitchtip-migrate:
    image: glitchtip/glitchtip:latest
    restart: "no"
    depends_on:
      - glitchtip-postgres
      - glitchtip-redis
    command: ./manage.py migrate
    environment: *glitchtip-environment

volumes:
  aptabase-db-data:
  aptabase-events-data:
  caddy-config:
  caddy-data:
  glitchtip-postgres-data:
  glitchtip-redis-data:
  glitchtip-uploads:
