services:
  telemetry:
    build:
      context: .
    restart: unless-stopped
    environment:
      ADDR: ":8080"
      DATA_DIR: /data
      VIEW_USERNAME: ${VIEW_USERNAME:-admin}
      VIEW_PASSWORD: ${VIEW_PASSWORD:?Set VIEW_PASSWORD in .env}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    volumes:
      - telemetry-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  telemetry-data:
